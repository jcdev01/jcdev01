<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Jairo Costa — Backend Developer em formação</title>
  <desc id="d">Java, Spring Boot, Python e APIs REST</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="900" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle cx="770" cy="110" r="260" fill="url(#glow)"/>

    <!-- motivo: nós conectados (serviços / APIs) -->
    <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" fill="none">
      <line x1="700" y1="70" x2="790" y2="120"/>
      <line x1="790" y1="120" x2="850" y2="60"/>
      <line x1="790" y1="120" x2="760" y2="215"/>
      <line x1="760" y1="215" x2="850" y2="245"/>
    </g>
    <g fill="#0b0f14" stroke="#22d3ee" stroke-width="2.5">
      <circle cx="700" cy="70" r="9"/>
      <circle cx="850" cy="60" r="9"/>
      <circle cx="760" cy="215" r="9"/>
      <circle cx="850" cy="245" r="9"/>
    </g>
    <circle cx="790" cy="120" r="15" fill="#22d3ee"/>
  </g>

  <rect x="56" y="62" width="5" height="196" rx="2.5" fill="url(#bar)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="86" y="92" font-size="24" fill="#22d3ee">&gt; olá, eu sou</text>
    <text x="86" y="266" font-size="25" fill="#8b98a5">Java • Spring Boot • Python • APIs REST</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="84" y="168" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1">Jairo Costa</text>
    <text x="86" y="216" font-size="34" font-weight="600" fill="#22d3ee">Backend Developer em formação</text>
  </g>
</svg>
